version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - unused
        path: _test\.go
      - linters:
          - gosec
        text: G304
      - linters:
          - gosec
        text: G404
      - linters:
          - gosec
        text: G115
      - linters:
          - gosec
        text: G306
    paths:
      - testdata
      - bin
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - testdata
      - bin
      - third_party$
      - builtin$
      - examples$
